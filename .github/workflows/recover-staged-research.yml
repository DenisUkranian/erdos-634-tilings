name: Recover staged research objects
on:
  push:
    branches: ['publish/materials-20260930']
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/upload-artifact@v4
        with:
          name: staged-research-objects
          path: .research-transport/
          include-hidden-files: true
          retention-days: 1
