name: Import and verify all research materials
on:
  push:
    branches: ['publish/materials-20260930']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      BASE: 47331354525e35515858ef96740866e1d4b3c300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Restore all source packages and verify their hashes
        run: |
          set -o pipefail
          git worktree add "$RUNNER_TEMP/publish" "$BASE"
          mkdir -p "$RUNNER_TEMP/publish/audit-output"
          python .research-transport/import.py "$RUNNER_TEMP/publish" | tee "$RUNNER_TEMP/publish/audit-output/source-import.log"
          python .research-transport/finish_import.py "$RUNNER_TEMP/publish" | tee "$RUNNER_TEMP/publish/audit-output/uniform-import.log"
      - name: Install document build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pandoc texlive-xetex texlive-latex-extra texlive-fonts-recommended fonts-dejavu-core lmodern
      - name: Rebuild publication outputs and integrity manifests
        run: |
          cd "$RUNNER_TEMP/publish"
          set -o pipefail
          python scripts/build_publication_outputs.py 2>&1 | tee audit-output/document-build.log
          python scripts/build_manifest.py
          python scripts/check_repository.py --output audit-output/inventory.json
      - name: Replay every finite suite including uniform reduction
        run: |
          cd "$RUNNER_TEMP/publish"
          set -o pipefail
          python scripts/verify_all.py --jobs 2 2>&1 | tee audit-output/full-replay.log
      - name: Commit verified research content without changing workflows or main
        run: |
          cd "$RUNNER_TEMP/publish"
          git config user.name 'Denis Paliy'
          git config user.email '120090909+DenisUkranian@users.noreply.github.com'
          git add .
          git diff --cached --exit-code "$BASE" -- .github/workflows
          git commit -m 'Publish N105 proofs, constructive spectra and uniform reduction' -m 'Hash-verify original sources; rebuild PDFs and expanded coordinates; replay legacy, four N105, general-spectra, uniform-reduction and c-relation suites. Preserve workflow files for a separate authorized connector edit. English-only landing page. No complete all-integer classification is claimed.'
          git rev-parse HEAD | tee audit-output/verified-commit.txt
          git archive --format=zip HEAD > audit-output/verified-source.zip
          git push origin HEAD:refs/heads/publish/verified-n105-20260930
      - name: Preserve full verification evidence and source snapshot
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-all-research-import
          path: ${{ runner.temp }}/publish/audit-output/
          retention-days: 7
